<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="site-header">

    <nav class="main-nav">

        <a href="menu.html">Menu</a >

        <p>Choose Your Food</p >
    

    <main>

        <h2>Today's Menu</h2>

        <div class="food-container">

            <div class="food-card">

                <div class="food-icon">🍗</div>

                <h3>Chicken Rice</h3>

                <p>RM 12.00</p >

                <button onclick="selectFood('Chicken Rice')">

                    Choose

                </button>

            </div>

            <div class="food-card">

                <div class="food-icon">🍝</div>

                <h3>Fried Noodles</h3>

                <p>RM 10.00</p >

                <button onclick="selectFood('Fried Noodles')">

                    Choose

                </button>

            </div>

            <div class="food-card">

                <div class="food-icon">🥗</div>

                <h3>Vegetable Rice</h3>

                <p>RM 6.00</p >

                <button onclick="selectFood('Vegetable Rice')">

                    Choose

                </button>

            </div>

        </div>

    </main>

    <script src="script.js"></script>
